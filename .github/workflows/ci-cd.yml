name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ============================================
  # JOB 1: Code Quality & Linting
  # ============================================
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Python linting tools
      run: |
        pip install flake8 black isort mypy
    
    - name: Lint ML Service (flake8)
      run: |
        cd ml_service
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Format check (black)
      run: |
        cd ml_service
        black --check .
      continue-on-error: true
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm ci --prefer-offline --no-audit
    
    - name: Lint Frontend
      run: |
        cd frontend
        npm run lint || true
      continue-on-error: true
    
    - name: Type check Frontend
      run: |
        cd frontend
        npx tsc --noEmit || true
      continue-on-error: true

  # ============================================
  # JOB 2: ML Service Tests
  # ============================================
  test-ml-service:
    name: Test ML Service
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'ml_service/requirements.txt'
    
    - name: Cache Python packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local/lib/python*/site-packages
        key: ${{ runner.os }}-python-${{ hashFiles('ml_service/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-
    
    - name: Install ML Service dependencies
      run: |
        cd ml_service
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run ML Service unit tests
      run: |
        cd ml_service
        pytest test_main.py -v --cov=main --cov-report=term-missing
    
    - name: Test model loading
      run: |
        cd ml_service
        python -c "import joblib; import os; print('Model directory exists:', os.path.exists('models'))"
    
    - name: Test prediction endpoint (smoke test)
      run: |
        cd ml_service
        pip install fastapi
        # Quick smoke test that main.py can be imported
        python -c "from main import app; print('FastAPI app loaded successfully')"

  # ============================================
  # JOB 3: Frontend Build Tests
  # ============================================
  test-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    
    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm ci --prefer-offline --no-audit
    
    - name: Build Frontend
      run: |
        cd frontend
        npm run build
    
    - name: Check build output
      run: |
        test -d frontend/.next && echo "✓ Build successful" || exit 1

  # ============================================
  # JOB 4: Docker Build Tests
  # ============================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-ml-service, test-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build ML Service Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ml_service
        push: false
        load: true
        tags: md-system/ml-service:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        load: true
        tags: md-system/frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Verify Docker images
      run: |
        docker images | grep md-system || echo "No local images found (ok if using buildx cache only)"

  # ============================================
  # JOB 5: Integration Tests
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-docker]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Start services with Docker Compose
      run: |
        docker compose up -d ml_service db
        sleep 10
    
    - name: Wait for services to be healthy
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
    
    - name: Test ML Service health endpoint
      run: |
        response=$(curl -s http://localhost:8080/health)
        echo "$response" | grep -q "healthy" || exit 1
        echo "✓ ML Service is healthy"
    
    - name: Test prediction endpoint
      run: |
        response=$(curl -s -X POST http://localhost:8080/predict \
          -H "Content-Type: application/json" \
          -d '{
            "customer_id": "TEST001",
            "age": 35,
            "purchase_history": 20,
            "avg_order_value": 150.50,
            "last_purchase_days": 7,
            "region": "North America",
            "seasonality_factor": 1.2
          }')
        echo "$response" | grep -q "predicted_demand" || exit 1
        echo "✓ Prediction endpoint works"
    
    - name: Cleanup
      if: always()
      run: |
        docker compose down -v

  # ============================================
  # JOB 6: Security Scanning
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'ml_service/requirements.txt'
    
    - name: Cache Python packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local/lib/python*/site-packages
        key: ${{ runner.os }}-python-${{ hashFiles('ml_service/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-
    
    - name: Install security tools
      run: |
        pip install safety bandit
    
    - name: Check Python dependencies for vulnerabilities
      run: |
        cd ml_service
        safety check --file requirements.txt || true
      continue-on-error: true
    
    - name: Scan Python code for security issues
      run: |
        cd ml_service
        bandit -r . -f json -o bandit-report.json || true
      continue-on-error: true
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    
    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm ci --prefer-offline --no-audit
    
    - name: Run npm audit
      run: |
        cd frontend
        npm audit --audit-level=moderate || true
      continue-on-error: true

  # ============================================
  # JOB 7: Deploy to GCP (on main branch)
  # ============================================
  deploy:
    name: Deploy to GCP (disabled)
    runs-on: ubuntu-latest
    needs: [lint, test-ml-service, test-frontend, integration-tests]
    if: false
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
    
    - name: Configure Docker for GCP
      run: |
        gcloud auth configure-docker
    
    - name: Submit to Cloud Build
      run: |
        gcloud builds submit --config cloudbuild.yaml \
          --substitutions=_REGION=${{ secrets.GCP_REGION }},_GCS_BUCKET=${{ secrets.GCS_BUCKET }}
    
    - name: Deployment status
      run: |
        echo "✅ Deployment triggered successfully"

