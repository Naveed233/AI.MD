name: CI (no GCP)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'ml_service/requirements.txt'
    
    - name: Cache Python packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local/lib/python*/site-packages
        key: ${{ runner.os }}-python-${{ hashFiles('ml_service/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-
    
    - name: Install ML Service dependencies
      run: |
        cd ml_service
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run ML Service tests
      run: |
        cd ml_service
        pytest test_main.py -v
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    
    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install Frontend dependencies
      run: |
        cd frontend
        npm ci --prefer-offline --no-audit
    
    - name: Build Frontend
      run: |
        cd frontend
        npm run build

  build:
    runs-on: ubuntu-latest
    needs: test
    if: false
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build and push images (disabled)
      run: echo "GCP deploy disabled for this repo"

