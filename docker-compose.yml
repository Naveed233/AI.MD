version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_KEY=
      - ML_API_URL=http://ml_service:8080
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_DATABASE=md_system
    depends_on:
      - db
      - ml_service
    volumes:
      - ./backend:/var/www/html

  ml_service:
    build: ./ml_service
    ports:
      - "8080:8080"
    environment:
      - GCS_BUCKET=md-system-data
      - PROJECT_ID=${PROJECT_ID}
    volumes:
      - ./ml_service/models:/app/models
    command: uvicorn main:app --host 0.0.0.0 --port 8080

  db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=md_system
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

